<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Open Multiple Queries/Searches</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 400px;
      margin: 0;
      padding: 16px;
      background-color: #202124;
      color: #e8eaed;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
    }

    textarea {
      width: 100%;
      height: 200px;
      background-color: #303134;
      color: #e8eaed;
      border: 1px solid #5f6368;
      border-radius: 4px;
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 16px;
    }

    textarea:focus {
      outline: none;
      border-color: #8ab4f8;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
    }

    .checkbox-container input {
      margin: 0;
      margin-right: 8px;
      cursor: pointer;
      accent-color: #8ab4f8;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background-color: #8ab4f8;
      color: #202124;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #aecbfa;
    }

    button:active {
      background-color: #8ab4f8;
    }

    .status {
      font-size: 12px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <h2>List of Queries / Searches</h2>
  <textarea id="queries-input" placeholder="Enter queries here (one per line)&#10;e.g.,&#10;cute cat&#10;cute dog&#10;cute fish"></textarea>

  <div class="options">
    <label class="checkbox-container">
      <input type="checkbox" id="chk-ignore-duplicates" checked>
      Ignore duplicate queries
    </label>
    <label class="checkbox-container">
      <input type="checkbox" id="chk-do-not-load">
      Do not load tabs until selected
    </label>
    <label class="checkbox-container">
      <input type="checkbox" id="chk-preserve-input" checked>
      Preserve input
    </label>
  </div>

  <div class="actions">
    <button id="btn-open">Open Searches</button>
    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
